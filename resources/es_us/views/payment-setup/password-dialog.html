<div id="palm-dialog-content" class="palm-dialog-content">
    <div id="title" class="dialog-title capitalize">
    	Contraseña de la cuenta de HP webOS
    </div>
    <div class="palm-dialog-separator"></div>
	<div id="acctEmail" class="palm-dialog-message"></div>
	<div class="space"></div>
	
	<div class="textfield-group" x-mojo-focus-highlight="true">
     <div class="title">
       <div id="acctPassword" name="textField" x-mojo-element="PasswordField"></div>
     </div> 
   </div>	
	
	<div id="passwordLengthError" class="palm-inline-error" style="display:none">
		<div class="error-message">La contraseña debe tener entre 6 y 20 caracteres.</div>
	</div>

	<div id="passwordError" class="palm-inline-error" style="display:none">
		<div class="error-message">La contraseña es incorrecta.</div>
	</div>
		
	<div id="forgotPassword" style="display:none">
		 <div x-mojo-element="Button" id="forgotPasswordButton"></div>	
	</div>
	
	<div x-mojo-element="Button" id="submitPassword"></div>	
	        
</div>
