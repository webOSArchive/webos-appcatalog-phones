<div id="palm-dialog-box-message" class="palm-dialog-content">
    <div id="title" class="dialog-title capitalize" x-mojo-loc="">
    	Change password
    </div>
    <div class="palm-dialog-separator">
    </div>
	<div class="space"></div>
	
	<div class="textfield-group" x-mojo-focus-highlight="true">
     <div class="title">
       <div id="newPassword" name="textField" x-mojo-element="PasswordField"></div>
     </div> 
   </div>
	
	<div class="textfield-group" x-mojo-focus-highlight="true">
     <div class="title">
       <div id="confirmPassword" name="textField" x-mojo-element="PasswordField"></div>
     </div> 
   </div>

	<div id="noPasswordMessage" class="palm-inline-error" style="display:none">
		<div class="error-message" x-mojo-loc="">Please enter password.</div>
	</div>
	
	<div id="passwordLengthError" class="palm-inline-error" style="display:none">
		<div class="error-message" x-mojo-loc="">Password must be between 6 and 20 characters long.</div>
	</div>
	
	<div id="mismatchMessage" class="palm-inline-error" style="display:none">
		<div class="error-message" x-mojo-loc="">Passwords do not match.</div>
	</div>
	
	<div id="noConfirmMessage" class="palm-inline-error" style="display:none">
		<div class="error-message" x-mojo-loc="">Please confirm password.</div>
	</div>
	
	<div id="systemErrorMessage" class="palm-inline-error" style="display:none">
		<div class="error-message" x-mojo-loc="">Unable to change password. Try again.</div>
	</div>
		
	<div x-mojo-element="Button" id="submitResetPassword"></div>	
		
</div>
